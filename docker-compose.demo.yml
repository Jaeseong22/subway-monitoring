# 시연 오버레이 (opt-in). scripts/demo.sh가 확장 오버레이와 함께 겹쳐 쓴다.
#
# 평소 설정(5분 주기, 30분 분석 구간)으로는 급증 → 확정 → 확장 → 검증까지 30분 가까이
# 걸려 발표 시간 안에 보여줄 수 없다. 시연 동안만 주기를 줄인다.
# 확장 후 검증 대기(REMEDIATION_VERIFY_AFTER_MINUTES)는 호스트 워커가 읽으므로
# scripts/demo.sh에서 워커를 띄울 때 넘긴다.
#
#   scripts/demo.sh up       # 시연 모드
#   scripts/demo.sh normal   # 평소 모드로 복귀

services:
  backend:
    environment:
      # 골든시그널을 5초마다 남긴다(평소 60초). 급증을 넣고 몇 초 안에 Kibana 그래프와
      # 분석에 반영되게 하려는 것이다. 탐지는 초당 요청 수로 비교하므로 기준선과 단위가 맞다.
      - MONITORING_GOLDEN_SIGNALS_INTERVAL_MS=5000

  ai_model:
    environment:
      - RUN_INTERVAL_MINUTES=1
      # 최근 30초(5초 주기 지표 6개)를 본다. 12초로 줄이면 지표 2~3개의 평균이 대기 상태에서도
      # 0.8~1.6으로 출렁여, 평소(60초) 지표로 만든 기준선 대비 z≥2를 넘는 구간이 생겼다(오탐).
      - LOOKBACK_MINUTES=0.5
      # LLM 공급자가 막히면 SDK 재시도로 분석이 2분 넘게 멈췄다. 시연에서는 10초에 끊고
      # 재시도하지 않은 채 통계 결과로 넘어간다.
      - LLM_TIMEOUT_SECONDS=10
      - LLM_CLIENT_MAX_RETRIES=0
      - LLM_RETRY_ATTEMPTS=1
      # 분석 요약(대시보드 문장)은 검증 패널·진단과 동시에 돈다. 저장할 때 끝나 있지 않으면
      # 기다리지 않고 통계 문장으로 저장한다. 판정과 확장 제안에는 영향이 없다.
      - LLM_SUMMARY_WAIT_SECONDS=0
      # 시연에서는 한 번 감지되면 바로 확정한다(평소에는 연속 2회 확인).
      - ANOMALY_CONSECUTIVE_N=1
      # 확장 → 정상 복귀 → 축소를 한 바퀴에 보여주기 위해, 시연에서는 쿨다운 없이 정상 1회면
      # 바로 축소를 제안한다(평소 15분 쿨다운, 정상 6회 연속). 승인은 여전히 사람이 한다.
      - REMEDIATION_COOLDOWN_MINUTES=0
      - REMEDIATION_SCALE_IN_AFTER_NORMAL_RUNS=1
